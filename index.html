<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>برای {{NAME}} 💙</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <main class="hero">

        <div class="glow"></div>

        <div class="photo-container">
            <img src="{{PHOTO}}" alt="{{NAME}}">
        </div>

        <div class="heart">♥</div>

        <h1>
            برای {{NAME}}
        </h1>

        <div class="line"></div>

        <p class="message">
            {{MESSAGE}}
        </p>

        <button id="loveButton">
            یک چیز دیگه هست... 💌
        </button>

        <div id="secret" class="secret">
            فقط خواستم بدونی
            دیدن اسمت هنوز هم می‌تونه
            لبخند روی صورتم بیاره. 💙
        </div>

    </main>

    <div id="hearts"></div>

    <audio id="music" loop>
        <source src="{{MUSIC}}" type="audio/mpeg">
    </audio>

    <button id="musicButton">
        🎵
    </button>

    <script src="app.js"></script>

</body>
</html>
